name: Renderer conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  templates-and-rollouts:
    runs-on: ubuntu-latest
    env:
      RENDERERS_UPSTREAM_ENCODER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12
      - name: Pinned templates and production-client rollouts
        run: uv run pytest tests/conformance -v --junitxml=conformance.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-conformance
          path: conformance.xml

  vllm-parsers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VLLM_SOURCE_COMMIT: db9527a46873454610df6dbedf79a36d6bf1a7f6
      RENDERERS_UPSTREAM_ENCODER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: db9527a46873454610df6dbedf79a36d6bf1a7f6
          path: upstream-vllm
      - uses: astral-sh/setup-uv@v7
      - name: Install actual pinned parser runtime
        id: runtime
        run: |
          uv sync --python 3.12 --no-dev --extra transformers
          uv pip install --python .venv/bin/python vllm==0.31.0 transformers==5.17.0 openai-harmony==0.0.8 pytest pytest-asyncio
      - name: Pin tokenizer assets for unchanged upstream fixtures
        id: assets
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/vllm-tokenizers
        run: uv run --no-sync tests/conformance/prepare_upstream.py
      - name: Run upstream engine tests without changing their expectations
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: uv run --no-sync tests/conformance/run_upstream.py upstream-vllm --junitxml=vllm-engine.xml
      - name: Unmodified upstream reasoning tests
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/vllm-tokenizers
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run --no-sync tests/conformance/run_upstream.py upstream-vllm --suite reasoning --junitxml=vllm-reasoning.xml
      - name: Unmodified upstream tool parser tests
        if: ${{ !cancelled() && steps.assets.outcome == 'success' }}
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/vllm-tokenizers
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run --no-sync tests/conformance/run_upstream.py upstream-vllm --suite tools --junitxml=vllm-tools.xml
      - name: Export upstream self-validated scenarios
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: uv run --no-sync tests/conformance/export_vllm.py upstream-vllm vllm-corpus.json
      - name: Real BPE, complete and streaming parser fidelity
        id: audit
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: uv run --no-sync -m tests.conformance.audit_vllm vllm-corpus.json renderer-fidelity.json
      - name: Summarize disagreements and authority decisions
        if: ${{ !cancelled() && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') }}
        run: uv run --no-sync -m tests.conformance.report renderer-fidelity.json renderer-fidelity.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vllm-fidelity
          path: |
            vllm-engine.xml
            vllm-reasoning.xml
            vllm-tools.xml
            vllm-corpus.json
            renderer-fidelity.json
            renderer-fidelity.jsonl
            renderer-fidelity.md
