name: Test

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/test.yml"

jobs:
  unit:
    name: Offline unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -m "not network" -v

  model-parity:
    name: Pinned model parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      RENDERERS_TEST_NETWORK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache pinned Hugging Face assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-renderers-${{ hashFiles('tests/model_assets.py') }}

      - name: Install dependencies
        run: uv sync

      - name: Run text model parity tests
        run: uv run pytest tests/ -m "network and not multimodal" -v

  multimodal-parity:
    name: Pinned multimodal parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      RENDERERS_TEST_NETWORK: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache pinned Hugging Face assets
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-renderers-${{ hashFiles('tests/model_assets.py') }}

      - name: Install dependencies
        run: uv sync

      - name: Run multimodal parity tests
        run: uv run pytest tests/ -m "multimodal" -v
