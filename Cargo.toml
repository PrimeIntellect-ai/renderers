[workspace]
resolver = "2"
members = [
    "crates/renderers-core",
    "crates/renderers-py",
    "crates/renderers-cli",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/thomaub/renderers"
rust-version = "1.85"

[workspace.dependencies]
tokenizers = { version = "0.23", default-features = false, features = ["onig", "esaxx_fast"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
thiserror = "2"
smallvec = { version = "1", features = ["union", "const_generics"] }
bumpalo = { version = "3", features = ["collections"] }
phf = { version = "0.13", features = ["macros"] }
clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# clippy::all = correctness + suspicious + style + complexity + perf.
# Already clean today; keep it that way.
all = { level = "deny", priority = -1 }
# Pedantic is informational only — flags style improvements without breaking CI.
pedantic = { level = "warn", priority = -1 }
# Stylistic pedantic lints we deliberately tolerate.
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
missing_errors_doc = "allow"
return_self_not_must_use = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
overflow-checks = false
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true
