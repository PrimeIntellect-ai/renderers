[workspace]
resolver = "2"
members = [
    "crates/renderers-core",
    "crates/renderers-py",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/thomaub/renderers"
rust-version = "1.78"

[workspace.dependencies]
tokenizers = { version = "0.20", default-features = false, features = ["onig", "esaxx_fast"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
once_cell = "1"
thiserror = "1"
smallvec = { version = "1", features = ["union", "const_generics"] }
bumpalo = { version = "3", features = ["collections"] }
phf = { version = "0.11", features = ["macros"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
overflow-checks = false
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true
