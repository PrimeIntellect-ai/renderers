[package]
name = "renderers-py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for renderers-core."

[lib]
name = "renderers_native"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
renderers-core = { path = "../renderers-core" }
pyo3 = { version = "0.28", features = ["abi3-py310"] }
serde = { workspace = true }
serde_json = { workspace = true }
pythonize = "0.28"
numpy = "0.28"
ndarray = "0.17"

[lints]
workspace = true
